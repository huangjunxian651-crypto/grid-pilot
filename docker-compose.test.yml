version: "3.9"

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gridpilot
      POSTGRES_PASSWORD: gridpilot
      POSTGRES_DB: gridpilot_test
    ports:
      - "25433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "26380:6379"
    volumes:
      - redisdata_test:/data

volumes:
  pgdata_test:
  redisdata_test:
